services:
  mysql:
    image: docker.arvancloud.ir/mysql:8.4
    container_name: mysql
    environment:
      MYSQL_DATABASE: sms_gateway
      MYSQL_USER: sms_user
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-sms_password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_password}"
      TZ: UTC
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  db-migrate:
    build:
      context: ./migrator
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "sms_user:${MYSQL_PASSWORD:-sms_password}@tcp(mysql:3306)/sms_gateway?multiStatements=true"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  sms-gateway:
    container_name: sms-gateway
    build:
      context: ./sms-gateway
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "sms_user:${MYSQL_PASSWORD:-sms_password}@tcp(mysql:3306)/sms_gateway?parseTime=true"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}"
    depends_on:
      mysql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  sms-worker-normal:
    build:
      context: ./sms-worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "sms_user:${MYSQL_PASSWORD:-sms_password}@tcp(mysql:3306)/sms_gateway?parseTime=true"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}"
      WORKER_SERVICE_TYPE: normal
    depends_on:
      mysql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  sms-worker-express:
    build:
      context: ./sms-worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "sms_user:${MYSQL_PASSWORD:-sms_password}@tcp(mysql:3306)/sms_gateway?parseTime=true"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}"
      WORKER_SERVICE_TYPE: express
    depends_on:
      mysql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  rabbitmq:
    image: docker.arvancloud.ir/rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
  rabbitmq_data:
